<script>
/* versione da mostrare: ?tema=classica o ?tema=rinnovata, ricordata nel browser; carica solo il suo carattere */
(function () {
  var t, d = document.documentElement;
  try { t = new URLSearchParams(location.search).get("tema"); if (t) localStorage.setItem("parmax:tema", t); else t = localStorage.getItem("parmax:tema"); } catch (e) {}
  t = t === "rinnovata" ? "rinnovata" : "classica";
  d.dataset.tema = t;
  var l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = t === "rinnovata" ? "https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" : "https://fonts.googleapis.com/css2?family=Work+Sans:wght@400..700&display=swap";
  document.head.appendChild(l);
})();
</script>
